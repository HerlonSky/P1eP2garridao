{% extends 'financas/base.html' %}
{% block title %}Entrar{% endblock %}

{% block content %}
<div class="card p-4 bg-white mx-auto" style="max-width: 420px;">
    <h1 class="h3 mb-3">Entrar</h1>

    {% if form.non_field_errors %}
        <div class="alert alert-danger">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required
                   value="{{ form.username.value|default:'' }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
</div>
{% endblock %}
